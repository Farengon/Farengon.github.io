# 自定义 GitHub Pages 部署工作流
# 目的：绕过 GitHub 隐式 Pages 工作流固定的 10 分钟超时限制，
#       将构建与部署超时放宽到 30 分钟，避免偶发超时导致部署取消。
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 访问 Pages 部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署；进行中时新推送进入等待（不取消进行中的部署）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        timeout-minutes: 30
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 30
