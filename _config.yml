title: "AP Tutorial" # 你的网站标题
description: "一个分享 AP 课程备考指南和教程的网站。"

# 主题已本地化到仓库（_sass/_includes/_layouts/assets），不再使用远程主题

# 基础 URL 配置（因为是 username.github.io，这里留空即可）
baseurl: ""
url: "https://Farengon.github.io" # 记得把 your-username 改成你的 GitHub 用户名

permalink: pretty

# 不参与构建的文件/目录（大文件 PDF 不复制进 _site，加快构建）
exclude:
  - csa/*.pdf
  - README.md
  - .workbuddy
  - 生成报告.txt
  - vendor
  - node_modules
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock

# 启用内置搜索
search_enabled: true
search:
  tokenizer: 'any' # 更好地支持中英文混合搜索
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  rel_url: true
  button: false
  focus_shortcut_key: "k"

# 代码块复制按钮
enable_copy_code_button: true

# 标题锚点
heading_anchors: true

# 主题相关设置
aux_links:
  "我的 GitHub": "https://github.com/Farengon/Farengon.github.io"
aux_links_new_tab: false

back_to_top: true
back_to_top_text: "返回顶部"

# 页脚内容
footer_content: '欢迎学习 AP Computer Science A © Farengon'

# 颜色方案（light 为默认）
# color_scheme: nil

callouts:
  syntax:
    title: Syntax
    color: green
  tips:
    title: Tips
    color: yellow
  important:
    title: Important
    color: blue
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red
  extra:
    color: grey-lt

plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-sitemap

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  quiet_deps: true
  silence_deprecations: ['import']
